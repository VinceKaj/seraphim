[project]
name = "seraphim"
version = "0.1.0"
description = "Live knowledge base and map of the Ukraine-Russia war, built from scraped media."
requires-python = ">=3.12"
dependencies = [
    "atproto==0.0.73",
    "datasette>=0.65.5",
    "datasette-cluster-map>=0.18.2",
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "datasette>=0.65.5",
    "pytest>=9.2.0",
]
