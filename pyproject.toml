[project]
name = "seraphim"
version = "0.1.0"
description = "Live knowledge base and map of the Ukraine-Russia war, built from scraped media."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "atproto==0.0.73",
    "beautifulsoup4>=4.15.0",
    "datasette>=0.65.5",
    "datasette-cluster-map>=0.18.2",
    "duckdb>=2.0.0",
    "fastapi>=0.162.2",
    "h3>=4.5.0",
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "datasette>=0.65.5",
    "pytest>=9.2.0",
]
